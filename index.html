<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Relay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
html,body{margin:0; padding:0;}
:root{
  --bg:#f9f9f7; --surface:#fcfcfb; --surface-raised:#ffffff;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --border:rgba(11,11,11,0.10); --border-strong:rgba(11,11,11,0.18);
  --accent:#2a78d6; --accent-ink:#ffffff;
  --gridline:#e1e0d9; --baseline:#c3c2b7;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --cat-companyprofile:#008300; --cat-technical:#2a78d6; --cat-financial:#eb6834; --cat-marketing:#1baf7a; --cat-sitevisit:#eda100; --cat-other:#e87ba4;
  --owner-us:#2a78d6; --owner-client:#4a3aa7;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --shadow-card:0 1px 2px rgba(11,11,11,.06),0 1px 1px rgba(11,11,11,.04);
  --shadow-modal:0 20px 60px rgba(11,11,11,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0d0d; --surface:#1a1a19; --surface-raised:#221f1e;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#928f88;
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
    --accent:#3987e5; --accent-ink:#ffffff;
    --gridline:#2c2c2a; --baseline:#383835;
    --cat-companyprofile:#008300; --cat-technical:#3987e5; --cat-financial:#d95926; --cat-marketing:#199e70; --cat-sitevisit:#c98500; --cat-other:#d55181;
    --owner-us:#3987e5; --owner-client:#9085e9;
    --shadow-card:0 1px 2px rgba(0,0,0,.4),0 1px 1px rgba(0,0,0,.3);
    --shadow-modal:0 20px 60px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --surface-raised:#221f1e;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#928f88;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
  --accent:#3987e5; --accent-ink:#ffffff;
  --gridline:#2c2c2a; --baseline:#383835;
  --cat-companyprofile:#008300; --cat-technical:#3987e5; --cat-financial:#d95926; --cat-marketing:#199e70; --cat-sitevisit:#c98500; --cat-other:#d55181;
  --owner-us:#3987e5; --owner-client:#9085e9;
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 1px 1px rgba(0,0,0,.3);
  --shadow-modal:0 20px 60px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text-primary);
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:700; text-wrap:balance;}
p{margin:0;}
button,input,select,textarea{font:inherit; color:inherit;}
button{cursor:pointer;}
a{color:var(--accent);}
::selection{background:color-mix(in srgb, var(--accent) 30%, transparent);}

/* ---------- App shell ---------- */
.app{display:flex; height:100%; min-height:100%;}
.sidebar{
  width:232px; flex:0 0 auto; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 14px; gap:4px;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 20px;}
.brand-mark{width:28px; height:28px; border-radius:8px; background:var(--accent); flex:0 0 auto; position:relative;}
.brand-mark::after{content:""; position:absolute; inset:7px; border-radius:3px; background:var(--accent-ink); opacity:.9;}
.brand-name{font-size:17px; font-weight:800; letter-spacing:-0.01em;}
.navitem{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm);
  color:var(--text-secondary); font-weight:600; font-size:13.5px; background:none; border:none; text-align:left; width:100%;
}
.navitem svg{width:17px; height:17px; flex:0 0 auto;}
.navitem:hover{background:var(--border); color:var(--text-primary);}
.navitem.active{background:color-mix(in srgb, var(--accent) 14%, var(--surface)); color:var(--accent);}
.nav-badge{margin-left:auto; background:var(--critical); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; min-width:16px; text-align:center;}
.sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:4px; padding-top:10px; border-top:1px solid var(--border);}

.main{flex:1 1 auto; min-width:0; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.topbar{
  position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px);
  display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--border);
}
.topbar h1{font-size:19px;}
.topbar .spacer{flex:1;}
.view{padding:22px 24px 48px; max-width:1180px;}
.view[hidden]{display:none;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border-strong); background:var(--surface-raised); color:var(--text-primary);
  font-weight:600; font-size:13px; white-space:nowrap;
}
.btn:hover{border-color:var(--text-muted);}
.btn:focus-visible, .navitem:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.07);}
.btn-danger{color:var(--critical); border-color:var(--critical);}
.btn-danger:hover{background:color-mix(in srgb, var(--critical) 10%, transparent);}
.btn-ghost{border-color:transparent; background:none;}
.btn-ghost:hover{background:var(--border);}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn svg{width:14px; height:14px;}
.icon-btn{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:var(--radius-sm); border:1px solid transparent; background:none;}
.icon-btn:hover{background:var(--border);}
.icon-btn svg{width:16px; height:16px;}

/* ---------- Cards / layout ---------- */
.card{background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); min-width:0;}
.card-pad{padding:18px 20px;}
.grid-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
.stat-tile{padding:16px 18px;}
.stat-label{font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}
.stat-value{font-size:28px; font-weight:800; margin-top:6px; letter-spacing:-0.02em;}
.stat-sub{font-size:12px; color:var(--text-secondary); margin-top:4px;}
.section-head{display:flex; align-items:baseline; gap:10px; margin:28px 0 12px;}
.section-head:first-child{margin-top:0;}
.section-head h2{font-size:15px;}
.section-head .count{color:var(--text-muted); font-size:12px; font-weight:600;}
.section-head .spacer{flex:1;}
.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start;}
.two-col > div{min-width:0;}

/* ---------- Pills / badges ---------- */
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 8px; border-radius:999px; font-size:12px; font-weight:600; background:var(--surface); border:1px solid var(--border); color:var(--text-secondary); white-space:nowrap;}
.pill .dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
.dim-row{display:flex; flex-wrap:wrap; gap:6px;}
.dim-chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--text-muted); padding:2px 8px 2px 6px; border-radius:999px; background:var(--surface); border:1px solid var(--border);}
.dim-chip .dot{width:6px; height:6px; border-radius:50%;}
.dim-chip b{color:var(--text-secondary); font-weight:600;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto; border-radius:var(--radius-lg); border:1px solid var(--border); background:var(--surface-raised);}
table{width:100%; border-collapse:collapse; min-width:720px;}
th{text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:13px;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:color-mix(in srgb, var(--accent) 5%, transparent);}
.num{font-variant-numeric:tabular-nums; text-align:right;}
.row-clickable{cursor:pointer;}
.trunc{max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.muted{color:var(--text-muted);}
.sec{color:var(--text-secondary);}

/* ---------- Forms ---------- */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12px; font-weight:700; color:var(--text-secondary);}
.field .hint{font-size:11px; color:var(--text-muted); font-weight:500;}
input[type=text], input[type=date], input[type=time], input[type=number], input[type=search], select, textarea{
  padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface); color:var(--text-primary); width:100%;
}
textarea{resize:vertical; min-height:64px; font-family:inherit;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.radio-row{display:flex; gap:14px; align-items:center;}
.radio-row label{display:flex; align-items:center; gap:6px; font-weight:600; font-size:12.5px; color:var(--text-secondary);}
fieldset{border:none; padding:0; margin:0;}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(10,10,10,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto;}
.modal-backdrop[hidden]{display:none;}
.modal{background:var(--surface-raised); border-radius:var(--radius-lg); box-shadow:var(--shadow-modal); width:100%; max-width:560px; padding:22px 24px 24px; margin-bottom:5vh;}
.modal-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.modal-head h3{font-size:17px;}
.modal-head .spacer{flex:1;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px; padding-top:16px; border-top:1px solid var(--border);}
.modal-actions .spacer{flex:1;}

/* ---------- Timer ---------- */
.timer-card{padding:18px 20px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px;}
.timer-fields{display:flex; flex-wrap:wrap; gap:12px; flex:1 1 420px;}
.timer-fields .field{margin-bottom:0; min-width:150px; flex:1;}
.timer-display{display:flex; align-items:center; gap:14px;}
.timer-clock{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; min-width:104px;}
.timer-clock.running{color:var(--accent);}
.pulse-dot{width:9px; height:9px; border-radius:50%; background:var(--critical); animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.25;}}

/* ---------- Follow-up list ---------- */
.followup{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:13px 16px; border-bottom:1px solid var(--border); min-width:0;}
.followup:last-child{border-bottom:none;}
.followup .fu-main{flex:1 1 160px; min-width:0;}
.followup .fu-name{font-weight:700; font-size:13.5px;}
.followup .fu-sub{font-size:12px; color:var(--text-secondary); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- Charts ---------- */
.chart-card{padding:18px 20px;}
.chart-title{font-size:13px; font-weight:700; margin-bottom:2px;}
.chart-caption{font-size:11.5px; color:var(--text-muted); margin-bottom:16px;}
.hbar-row{display:grid; grid-template-columns:120px 1fr 52px; align-items:center; gap:10px; margin-bottom:10px;}
.hbar-row:last-child{margin-bottom:0;}
.hbar-label{font-size:12px; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hbar-track{height:16px; background:var(--gridline); border-radius:4px; position:relative; overflow:hidden;}
.hbar-fill{height:100%; border-radius:4px 0 0 4px; min-width:3px;}
.hbar-fill.full-round{border-radius:4px;}
.hbar-val{font-size:12px; font-variant-numeric:tabular-nums; color:var(--text-secondary); text-align:right;}
.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; padding-top:14px; border-top:1px solid var(--border);}
.legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary);}
.legend-item .dot{width:8px; height:8px; border-radius:50%;}
.vbar-chart{display:flex; align-items:flex-end; gap:5px; height:150px; padding-top:20px;}
.vbar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; position:relative;}
.vbar-col .vbar{width:100%; max-width:26px; border-radius:4px 4px 0 0; background:var(--accent); min-height:2px; position:relative;}
.vbar-col .vbar-label{font-size:10px; color:var(--text-muted); white-space:nowrap;}
.vbar-col .vbar-val{position:absolute; top:-18px; font-size:10.5px; font-weight:700; color:var(--text-secondary); font-variant-numeric:tabular-nums; opacity:0; transition:opacity .1s;}
.vbar-col:hover .vbar-val, .vbar-col:focus-within .vbar-val{opacity:1;}
.vbar-col:hover .vbar, .vbar-col:focus-within .vbar{background:var(--accent); filter:brightness(1.15);}
[data-tip]{position:relative;}
[data-tip]:hover::after, [data-tip]:focus-visible::after{
  content:attr(data-tip); position:absolute; bottom:calc(100% + 7px); left:50%; transform:translateX(-50%);
  background:var(--text-primary); color:var(--bg); font-size:11px; font-weight:600; padding:5px 8px; border-radius:6px;
  white-space:nowrap; z-index:20; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.2);
}

/* ---------- Empty states ---------- */
.empty{padding:44px 24px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;}
.empty svg{width:38px; height:38px; color:var(--text-muted); opacity:.7;}
.empty h3{font-size:14.5px;}
.empty p{color:var(--text-secondary); font-size:13px; max-width:340px;}
.empty .btn{margin-top:6px;}

/* ---------- Toast ---------- */
#toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--text-primary); color:var(--bg); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:toast-in .15s ease-out; max-width:min(90vw,360px);}
.toast-error{background:var(--critical); color:#fff;}
@keyframes toast-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Mobile ---------- */
.bottomnav{display:none;}
@media (max-width:760px){
  .sidebar{display:none;}
  .app{flex-direction:column;}
  .main{order:1; padding-bottom:70px; height:auto; flex:1;}
  .bottomnav{
    display:flex; order:2; position:fixed; bottom:0; left:0; right:0; z-index:10;
    background:var(--surface); border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  }
  .bottomnav .navitem{flex-direction:column; gap:3px; font-size:10.5px; align-items:center; padding:6px 2px; border-radius:8px;}
  .bottomnav .navitem svg{width:19px; height:19px;}
  .grid-stats{grid-template-columns:1fr 1fr;}
  .two-col{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
  .topbar{padding:14px 16px;}
  .view{padding:16px 16px 40px;}
  table{min-width:600px;}
  .section-head{flex-wrap:wrap;}
  .section-head input[type=search]{max-width:none !important; flex:1 1 100%;}
  .section-head > div{overflow-x:auto; max-width:100%; padding-bottom:2px;}
  .section-head > div .btn{flex:0 0 auto;}
}
@media (max-width:420px){
  .grid-stats{grid-template-columns:1fr 1fr;}
}

/* ---------- Auth screen ---------- */
.auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.auth-card{width:100%; max-width:360px; background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:28px 26px;}
.auth-card .brand{padding:0 0 20px; justify-content:center;}
.auth-card h2{font-size:17px; text-align:center; margin-bottom:4px;}
.auth-card p.sub{text-align:center; color:var(--text-secondary); font-size:12.5px; margin-bottom:20px;}
.auth-error{background:color-mix(in srgb, var(--critical) 10%, transparent); border:1px solid var(--critical); color:var(--critical); font-size:12.5px; font-weight:600; padding:8px 10px; border-radius:var(--radius-sm); margin-bottom:14px;}
.auth-toggle{text-align:center; margin-top:16px; font-size:12.5px; color:var(--text-secondary);}
.auth-toggle button{background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:12.5px; padding:0;}
.cloud-status{font-size:11px; color:var(--text-muted); padding:2px 10px 6px;}
/* ---------- Auth widget (top right) ---------- */
#auth-widget{display:flex; align-items:center; gap:8px; margin-left:12px;}
.auth-chip{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-secondary); font-weight:600;}
.auth-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex:0 0 auto;}
.auth-error{background:color-mix(in srgb, var(--critical) 10%, transparent); border:1px solid var(--critical); color:var(--critical); font-size:12.5px; font-weight:600; padding:8px 10px; border-radius:var(--radius-sm); margin-bottom:14px;}
.auth-toggle{text-align:center; margin-top:16px; font-size:12.5px; color:var(--text-secondary);}
.auth-toggle button{background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:12.5px; padding:0;}
</style>
</head>
<body>

<div id="app-root">
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="topbar">
        <h1 id="view-title">Dashboard</h1>
        <div class="spacer"></div>
        <div id="topbar-actions"></div>
        <div id="auth-widget"></div>
      </div>

      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-projects" hidden></section>
      <section class="view" id="view-worklog" hidden></section>
      <section class="view" id="view-analytics" hidden></section>
    </main>
  </div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal-body" role="dialog" aria-modal="true"></div>
</div>

<div id="toast-wrap"></div>

  {key:'companyProfile', label:'Company Profile', short:'Profile', options:STATUS_OPTIONS, def:'Not Started'},

/* ===================== utils ===================== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nowISO(){return new Date().toISOString();}
function todayStr(){return dateToStr(new Date());}
function dateToStr(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function parseDateLocal(s){ if(!s) return null; var parts=s.split('-'); return new Date(+parts[0], +parts[1]-1, +parts[2]); }
function fmtDate(s){ var d=parseDateLocal(s); if(!d) return '—'; return d.toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function fmtDateFull(s){ var d=parseDateLocal(s); if(!d) return '—'; return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'}); }
function fmtDateDDMMYYYY(s){ var d=parseDateLocal(s); if(!d) return s||''; return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear(); }
function latestWorklogDate(){
  var max=null; state.worklogs.forEach(function(w){ if(w.date && (!max || w.date>max)) max=w.date; });
  return max || todayStr();
}
function buildWhatsAppText(dateStr){
  var entries = state.worklogs.filter(function(w){return w.date===dateStr;})
    .sort(function(a,b){
      if(a.startTime && b.startTime) return a.startTime.localeCompare(b.startTime);
      return (a.createdAt||'').localeCompare(b.createdAt||'');
    });
  var header = 'Work log on '+fmtDateDDMMYYYY(dateStr);
  if(!entries.length) return header+'\n(No entries logged for this day.)';
  var lines = entries.map(function(w){
    var text = (w.particulars||'').trim();
    if(!text) text = (w.category||'Work')+' — '+(w.projectName||'project');
    if(!/[.!?]$/.test(text)) text += '.';
    return text;
  });
  return header+'\n'+lines.join('\n');
}
function daysSince(dateStr){ if(!dateStr) return null; var d=parseDateLocal(dateStr); var today=new Date(); d.setHours(0,0,0,0); today.setHours(0,0,0,0); return Math.round((today-d)/86400000); }
function minsToHrs(m){ return (Math.round((m||0)/6)/10); }
function fmtHrs(m){ var h=minsToHrs(m); return (h%1===0? h.toFixed(0): h.toFixed(1))+'h'; }
function fmtHM(mins){ mins=Math.max(0,Math.round(mins)); var h=Math.floor(mins/60), m=mins%60; return h+'h '+String(m).padStart(2,'0')+'m'; }
function startOfWeek(d){ var dt=new Date(d); var day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; }
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function debounceRAF(fn){ return function(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(function(){ renderQueued=false; fn(); }); }; }
function isUnstartedLike(v){ return v==='Not Started' || v==='Not Completed'; }
function overallStatus(p){
  var vals = DIMENSIONS.map(function(d){return p[d.key]||d.def;});
  if(vals.every(function(v){return v==='Completed';})) return 'Completed';
  if(vals.every(isUnstartedLike)) return 'Not Started';
  return 'In Progress';
}
function statusDot(status){
  if(status==='Completed') return 'var(--good)';
  if(isUnstartedLike(status)) return 'var(--text-muted)';
  if(status==='Draft') return 'var(--cat-technical)';
  return 'var(--warning)'; // WIP / In Progress / Scheduled
}
function projectMinutes(pid){
  var t=0; for(var i=0;i<state.worklogs.length;i++){ if(state.worklogs[i].projectId===pid) t+=(state.worklogs[i].durationMinutes||0); } return t;
}
function projectById(id){ for(var i=0;i<state.projects.length;i++) if(state.projects[i].id===id) return state.projects[i]; return null; }
function toast(msg, opts){
  opts = opts || {};
  var wrap=document.getElementById('toast-wrap');
  var el=document.createElement('div'); el.className='toast'+(opts.error?' toast-error':''); el.textContent=msg;
  wrap.appendChild(el);
  var dur = opts.error ? 6000 : 2600;
  setTimeout(function(){ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(function(){el.remove();},250); }, dur);
}
function toastError(msg){ toast(msg, {error:true}); }

/* ===================== local storage (no backend) =====================
   Everything (projects, worklogs, settings) is read from and written to
   this browser's localStorage as one JSON blob, under a single key.
   No network, no login, nothing that can hang or fail to reach a
   server — this step is purely about confirming the app itself works.
   Data here lives ONLY in this browser: it won't follow you to another
   device, and clearing site data / a different browser starts empty.
   That trade-off is intentional for this step — a real backend gets
   layered in afterward, once this baseline is confirmed solid. */
var LOCAL_KEY = 'relay_data_v1';

function loadLocalData(){
  try{
    var raw = localStorage.getItem(LOCAL_KEY);
    var parsed = raw ? JSON.parse(raw) : null;
    state.projects = (parsed && Array.isArray(parsed.projects)) ? parsed.projects : [];
    state.worklogs = (parsed && Array.isArray(parsed.worklogs)) ? parsed.worklogs : [];
    state.settings = Object.assign({staleDays:5}, (parsed && parsed.settings) || {});
  }catch(e){
    toastError('Could not read saved data from this browser — starting empty.');
    state.projects = []; state.worklogs = []; state.settings = {staleDays:5};
  }
  state.projectsLoaded = true;
  state.worklogsLoaded = true;
  state.ready = true;
  render();
}
function persistData(){
  try{
    localStorage.setItem(LOCAL_KEY, JSON.stringify({
      projects: state.projects,
      worklogs: state.worklogs,
      settings: state.settings
    }));
  }catch(e){
    toastError('Could not save — your browser\'s local storage may be full or disabled.');
  }
}
// Manual "try again" affordance (a button in the loading/empty states).
function reloadData(){
  toast('Reloading…');
  loadLocalData();
}

/* ===================== auth (login only — data stays local for now) =====================
   This deliberately does NOT load or save projects/worklogs/settings —
   those still come from localStorage. This step is only about proving
   sign-in/sign-up/sign-out work reliably on their own, isolated from
   everything else, before the next step wires them to real cloud data. */
function applySession(session){
  state.session = session;
  renderAuthWidget();
}
function initAuth(){
  if(!sb) return; // not configured — the widget shows a neutral state
  sb.auth.onAuthStateChange(function(event, session){
    // Defer off the synchronous callback — supabase-js serializes auth
    // operations internally, and doing work directly inside this
    // listener can make an in-flight signInWithPassword/signUp call
    // hang forever waiting on that same internal lock.
    setTimeout(function(){ applySession(session); }, 0);
  });
  sb.auth.getSession().then(function(res){
    state.authChecked = true;
    applySession(res.data.session);
  }).catch(function(){
    state.authChecked = true;
    renderAuthWidget();
  });
}
async function signOut(){
  if(!sb) return;
  try{ await sb.auth.signOut(); }
  catch(e){ toastError('Could not sign out: ' + ((e&&e.message)||'unknown error')); }
}
function renderAuthWidget(){
  var el = document.getElementById('auth-widget');
  if(!el) return;
  if(!sb){
    el.innerHTML = '<span class="auth-chip" data-tip="Paste your Supabase URL/key into the script to enable this">Login not configured</span>';
    return;
  }
  if(state.session){
    el.innerHTML =
      '<span class="auth-chip"><span class="dot"></span>'+esc(state.session.user.email)+'</span>'+
      '<button class="btn btn-sm" data-action="sign-out">Sign out</button>';
  } else {
    el.innerHTML = '<button class="btn btn-sm btn-primary" data-action="open-login">Sign in</button>';
  }
}
function openLoginModal(){
  state.authMode = 'signin';
  renderLoginModalBody();
}
function renderLoginModalBody(){
  var isSignUp = state.authMode==='signup';
  var html =
    '<div class="modal-head"><h3>'+(isSignUp?'Create your account':'Sign in')+'</h3></div>'+
    '<div id="auth-error" class="auth-error" hidden></div>'+
    '<form id="login-form">'+
      '<div class="field"><label>Email</label><input id="auth-email" type="email" required autocomplete="username"></div>'+
      '<div class="field" style="margin-top:12px;"><label>Password</label><input id="auth-password" type="password" required minlength="6" autocomplete="'+(isSignUp?'new-password':'current-password')+'"></div>'+
      '<div class="modal-actions">'+
        '<div class="auth-toggle" style="margin:0;">'+
          (isSignUp
            ? 'Have an account? <button type="button" data-action="auth-toggle-mode">Sign in</button>'
            : 'New here? <button type="button" data-action="auth-toggle-mode">Create an account</button>')+
        '</div>'+
        '<div class="spacer"></div>'+
        '<button type="button" class="btn" data-action="close-modal">Cancel</button>'+
        '<button type="submit" id="auth-submit" class="btn btn-primary">'+(isSignUp?'Create account':'Sign in')+'</button>'+
      '</div>'+
    '</form>';
  openModal(html);
  var form = document.getElementById('login-form');
  if(form){
    form.addEventListener('submit', function(e){ e.preventDefault(); submitAuthForm(); });
  }
}
// Self-contained: reads the form, drives the button/error text directly
// via the DOM rather than through state+render(), and always resets the
// button on failure so it can never get stuck mid-submit.
async function submitAuthForm(){
  var isSignUp = state.authMode==='signup';
  var emailEl = document.getElementById('auth-email');
  var passwordEl = document.getElementById('auth-password');
  var errorBox = document.getElementById('auth-error');
  var submitBtn = document.getElementById('auth-submit');
  var email = ((emailEl && emailEl.value) || '').trim();
  var password = (passwordEl && passwordEl.value) || '';
  if(errorBox){ errorBox.hidden = true; errorBox.textContent = ''; }
  if(!email || !password) return;
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = isSignUp ? 'Creating…' : 'Signing in…'; }
  try{
    var result = isSignUp
      ? await sb.auth.signUp({email:email, password:password})
      : await sb.auth.signInWithPassword({email:email, password:password});
    if(result.error) throw result.error;
    if(isSignUp && !result.data.session){
      state.authMode = 'signin';
      renderLoginModalBody();
      var msgBox = document.getElementById('auth-error');
      if(msgBox){ msgBox.hidden = false; msgBox.style.color = 'var(--good)'; msgBox.textContent = 'Account created. Check your email to confirm your address, then sign in.'; }
      return;
    }
    // Apply directly rather than waiting on onAuthStateChange — that
    // event can lag, and this response has already told us it worked.
    if(result.data && result.data.session) applySession(result.data.session);
    closeModal();
    toast('Signed in.');
  }catch(e){
    console.error('Auth error:', e);
    if(errorBox){ errorBox.hidden = false; errorBox.style.color = ''; errorBox.textContent = (e && e.message) || 'Something went wrong. Try again.'; }
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = isSignUp ? 'Create account' : 'Sign in'; }
  }
}

/* ===================== timer (localStorage convenience) ===================== */
function loadTimer(){
  try{
    var raw = localStorage.getItem('relay_timer');
    if(raw){ state.timer = JSON.parse(raw); startTicking(); }
  }catch(e){ state.timer = null; }
}
function persistTimer(){
  try{
    if(state.timer) localStorage.setItem('relay_timer', JSON.stringify(state.timer));
    else localStorage.removeItem('relay_timer');
  }catch(e){}
}
function startTicking(){
  if(timerInterval) return;
  timerInterval = setInterval(function(){ state.timerTick++; updateTimerDisplays(); }, 1000);
}
function stopTicking(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
function updateTimerDisplays(){
  document.querySelectorAll('.js-timer-clock').forEach(function(el){
    el.textContent = state.timer ? elapsedStr(state.timer.startedAt) : '0:00:00';
  });
}
function elapsedStr(startedAt){
  var s = Math.max(0, Math.floor((Date.now()-startedAt)/1000));
  var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function beginTimer(projectId, category, particulars){
  if(!projectId){ toast('Choose a project first.'); return; }
  state.timer = {projectId:projectId, category:category||'Technical', particulars:particulars||'', startedAt:Date.now()};
  persistTimer(); startTicking(); render();
}
function endTimer(){
  if(!state.timer) return;
  var t = state.timer;
  var endedAt = Date.now();
  var durationMinutes = Math.max(1, Math.round((endedAt-t.startedAt)/60000));
  var startD = new Date(t.startedAt), endD = new Date(endedAt);
  var proj = projectById(t.projectId);
  var entry = {
    id: newId(),
    projectId: t.projectId,
    projectName: proj ? proj.name : 'Unknown project',
    date: dateToStr(startD),
    particulars: t.particulars || '(timed entry)',
    category: t.category || 'Technical',
    startTime: fmtTimeHM(startD),
    endTime: fmtTimeHM(endD),
    durationMinutes: durationMinutes,
    createdAt: nowISO()
  };
  state.worklogs.push(entry);
  state.worklogsLoaded = true;
  state.timer = null; persistTimer(); stopTicking();
  toast('Logged '+fmtHrs(durationMinutes)+' to '+entry.projectName+'.');
  render();
  persistData();
}
function fmtTimeHM(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

/* ===================== CRUD =====================
   Every change here mutates local state directly, re-renders, and
   saves the whole thing to localStorage (see persistData above). */
function saveProject(data, id){
  if(id){
    var existing = projectById(id);
    if(existing) Object.assign(existing, data, {updatedAt:nowISO()});
    toast('Project updated.');
  } else {
    var row = Object.assign({id:newId(), createdAt:nowISO(), updatedAt:nowISO()}, data);
    state.projects.push(row);
    state.projectsLoaded = true;
    toast('Project added.');
  }
  closeModal();
  render();
  persistData();
}
function deleteProjectConfirmed(id){
  state.projects = state.projects.filter(function(p){ return p.id!==id; });
  toast('Project deleted.'); closeModal(); render();
  persistData();
}
function touchLastComm(id){
  var existing = projectById(id);
  if(existing) Object.assign(existing, {lastCommunication: todayStr(), updatedAt: nowISO()});
  toast('Marked as contacted today.'); render();
  persistData();
}
function saveWorklog(data, id){
  var proj = projectById(data.projectId);
  data.projectName = proj ? proj.name : 'Unknown project';
  if(id){
    var existing = state.worklogs.filter(function(w){return w.id===id;})[0];
    if(existing) Object.assign(existing, data);
    toast('Entry updated.');
  } else {
    var row = Object.assign({id:newId(), createdAt:nowISO()}, data);
    state.worklogs.push(row);
    state.worklogsLoaded = true;
    toast('Time logged.');
  }
  closeModal();
  render();
  persistData();
}
function deleteWorklogConfirmed(id){
  state.worklogs = state.worklogs.filter(function(w){ return w.id!==id; });
  toast('Entry deleted.'); closeModal(); render();
  persistData();
}
function saveSettings(staleDays){
  state.settings.staleDays = staleDays;
  toast('Settings saved.'); closeModal(); render();
  persistData();
}

/* ===================== CSV export ===================== */
function csvEscape(v){ v=String(v==null?'':v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
async function exportProjectsCSV(){
  var rows=[['Project','Overall Status',
    'Company Profile','Company Profile Owner','Company Profile Notes',
    'Technical','Technical Owner','Technical Notes',
    'Financial','Financial Owner','Financial Notes',
    'Marketing','Marketing Owner','Marketing Notes',
    'Site Visit','Site Visit Owner','Site Visit Notes',
    'Industry','Contact Person','Contact Email','Contact Phone','Location','Website',
    'Last Communication','Days Since Contact','Next Action','Next Move Owner','Total Hours','Remarks']];
  state.projects.forEach(function(p){
    rows.push([p.name, overallStatus(p),
      p.companyProfile||'', p.companyProfileOwner||'', p.companyProfileRemarks||'',
      p.technical||'', p.technicalOwner||'', p.technicalRemarks||'',
      p.financial||'', p.financialOwner||'', p.financialRemarks||'',
      p.marketing||'', p.marketingOwner||'', p.marketingRemarks||'',
      p.siteVisit||'', p.siteVisitOwner||'', p.siteVisitRemarks||'',
      p.companyIndustry||'', p.companyContact||'', p.companyEmail||'', p.companyPhone||'', p.companyLocation||'', p.companyWebsite||'',
      p.lastCommunication||'', daysSince(p.lastCommunication), p.nextAction||'', p.actionOwner==='client'?'Client':'Us',
      minsToHrs(projectMinutes(p.id)), p.remarks||'']);
  });
  var csv = rows.map(function(r){return r.map(csvEscape).join(',');}).join('\r\n');
  await doDownload('relay-projects.csv', csv);
}
async function exportWorklogCSV(){
  var rows=[['Date','Project','Category','Particulars','Start','End','Hours']];
  state.worklogs.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');}).forEach(function(w){
    rows.push([w.date||'', w.projectName||'', w.category||'', w.particulars||'', w.startTime||'', w.endTime||'', minsToHrs(w.durationMinutes)]);
  });
  var csv = rows.map(function(r){return r.map(csvEscape).join(',');}).join('\r\n');
  await doDownload('relay-worklog.csv', csv);
}
async function doDownload(filename, data){
  try{
    var blob = new Blob([data], {type:'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('Exported '+filename+'.');
  }catch(e){ toast('Could not export the file.'); }
}

/* ===================== follow-ups ===================== */
function computeFollowups(){
  var sd = state.settings.staleDays||5;
  return state.projects.filter(function(p){
    return overallStatus(p)!=='Completed' && daysSince(p.lastCommunication)!==null && daysSince(p.lastCommunication) > sd;
  }).sort(function(a,b){ return daysSince(b.lastCommunication)-daysSince(a.lastCommunication); });
}

    .sort(function(a,b){return b.mins-a.mins;}).slice(0,8);
  var maxProjMin = Math.max.apply(null, projRows.map(function(r){return r.mins;}).concat([1]));

  var byCat = {}; CATEGORIES.forEach(function(c){byCat[c]=0;});
  state.worklogs.forEach(function(w){ byCat[w.category||'Other']=(byCat[w.category||'Other']||0)+(w.durationMinutes||0); });
  var maxCatMin = Math.max.apply(null, Object.keys(byCat).map(function(k){return byCat[k];}).concat([1]));

  var days=[]; for(var i=13;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  var byDay = {}; state.worklogs.forEach(function(w){ byDay[w.date]=(byDay[w.date]||0)+(w.durationMinutes||0); });
  var maxDayMin = Math.max.apply(null, days.map(function(d){return byDay[dateToStr(d)]||0;}).concat([1]));

  el.innerHTML =
    '<div class="chart-card card" style="margin-bottom:16px;">'+
      '<div class="chart-title">Hours by project</div><div class="chart-caption">Top '+projRows.length+' by total time logged</div>'+
      projRows.map(function(r){

          '<div class="hbar-val">'+fmtHrs(r.mins)+'</div></div>';
      }).join('')+
    '</div>'+
    '<div class="two-col">'+
      '<div class="chart-card card">'+
        '<div class="chart-title">Hours by category</div><div class="chart-caption">Where the time actually goes</div>'+
        CATEGORIES.map(function(c){
          var pct = Math.max(byCat[c]>0?4:0, Math.round(byCat[c]/maxCatMin*100));
          return '<div class="hbar-row"><div class="hbar-label">'+c+'</div>'+
            '<div class="hbar-track" data-tip="'+fmtHrs(byCat[c])+'"><div class="hbar-fill full-round" style="width:'+pct+'%; background:var('+CATEGORY_VAR[c]+');"></div></div>'+
            '<div class="hbar-val">'+fmtHrs(byCat[c])+'</div></div>';
        }).join('')+
        '<div class="legend">'+CATEGORIES.map(function(c){return '<span class="legend-item"><span class="dot" style="background:var('+CATEGORY_VAR[c]+')"></span>'+c+'</span>';}).join('')+'</div>'+
      '</div>'+
      '<div class="chart-card card">'+
        '<div class="chart-title">Last 14 days</div><div class="chart-caption">Daily hours logged</div>'+
        '<div class="vbar-chart">'+days.map(function(d){
          var mins = byDay[dateToStr(d)]||0;
          var pct = Math.max(mins>0?4:1, Math.round(mins/maxDayMin*100));
          return '<div class="vbar-col" tabindex="0"><span class="vbar-val">'+(mins?fmtHrs(mins):'')+'</span><div class="vbar" style="height:'+pct+'%;"></div><span class="vbar-label">'+d.toLocaleDateString(undefined,{weekday:'narrow'})+'</span></div>';
        }).join('')+'</div>'+
      '</div>'+
    '</div>'+

    '</div>';
}

      '<div class="field"><label>Project name</label><input required type="text" id="pf-name" value="'+esc(v.name)+'" placeholder="e.g. Shri Maa Poly Films"></div>'+
      '<div class="field"><label>Company profile</label><span class="hint" style="display:block; margin:-2px 0 8px;">Background on the client — optional, but handy to have on hand.</span>'+
        '<div class="field-row">'+
          '<input type="text" id="pf-co-industry" value="'+esc(v.companyIndustry||'')+'" placeholder="Industry / sector">'+
          '<input type="text" id="pf-co-contact" value="'+esc(v.companyContact||'')+'" placeholder="Contact person">'+
        '</div>'+
        '<div class="field-row" style="margin-top:10px;">'+
          '<input type="email" id="pf-co-email" value="'+esc(v.companyEmail||'')+'" placeholder="Contact email">'+
          '<input type="text" id="pf-co-phone" value="'+esc(v.companyPhone||'')+'" placeholder="Contact phone">'+
        '</div>'+
        '<div class="field-row" style="margin-top:10px;">'+
          '<input type="text" id="pf-co-location" value="'+esc(v.companyLocation||'')+'" placeholder="Location">'+
          '<input type="text" id="pf-co-website" value="'+esc(v.companyWebsite||'')+'" placeholder="Website">'+
        '</div>'+
      '</div>'+
      '<div class="field"><label>Status by dimension</label><span class="hint" style="display:block; margin:-2px 0 8px;">Each section can have its own owner and its own notes.</span><div class="field-row" style="grid-template-columns:1fr 1fr; gap:10px;">'+
        DIMENSIONS.map(function(d){
          return '<div><label class="hint">'+d.label+'</label><select id="pf-'+d.key+'">'+d.options.map(function(s){return '<option'+((v[d.key]||d.def)===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
            '<div style="display:flex; gap:6px; margin-top:6px;"><input type="text" id="pf-'+d.key+'Owner" value="'+esc(v[d.key+'Owner']||'')+'" placeholder="Owner name" style="flex:1;">'+
              '<button type="button" class="btn btn-sm" data-action="fill-me" data-target="pf-'+d.key+'Owner">Me</button></div>'+
            '<input type="text" id="pf-'+d.key+'Remarks" value="'+esc(v[d.key+'Remarks']||'')+'" placeholder="Notes for '+d.label+'" style="margin-top:6px;">'+
          '</div>';
        }).join('')+
      '</div></div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Last communication</label><input type="date" id="pf-lastcomm" value="'+esc(v.lastCommunication||'')+'"></div>'+
        '<div class="field"><label>Next move is on</label><select id="pf-owner"><option value="us"'+(v.actionOwner!=='client'?' selected':'')+'>Us</option><option value="client"'+(v.actionOwner==='client'?' selected':'')+'>Client</option></select></div>'+
      '</div>'+
      '<div class="field"><label>Next action</label><input type="text" id="pf-nextaction" value="'+esc(v.nextAction||'')+'" placeholder="e.g. Send revised financial model"></div>'+
      '<div class="field"><label>Remarks</label><textarea id="pf-remarks" placeholder="Context, blockers, anything worth remembering">'+esc(v.remarks||'')+'</textarea></div>'+
      (p? '<div class="field"><label class="hint">'+logCount+' worklog '+(logCount===1?'entry':'entries')+' · '+fmtHrs(hrs)+' logged</label></div>' : '')+
      '<div class="modal-actions">'+
        (p? '<button type="button" class="btn btn-danger" data-action="delete-project" data-id="'+p.id+'">'+iconTrash()+'Delete</button>' : '')+
        '<div class="spacer"></div>'+
        '<button type="button" class="btn" data-action="close-modal">Cancel</button>'+
        '<button type="submit" class="btn btn-primary">'+(p?'Save changes':'Add project')+'</button>'+
      '</div>'+
    '</form>';
  openModal(html);
  document.getElementById('project-form').addEventListener('submit', function(e){
    e.preventDefault();
    var data = {
      name: document.getElementById('pf-name').value.trim(),
      lastCommunication: document.getElementById('pf-lastcomm').value,
      nextAction: document.getElementById('pf-nextaction').value.trim(),
      actionOwner: document.getElementById('pf-owner').value,
      remarks: document.getElementById('pf-remarks').value.trim(),
      companyIndustry: document.getElementById('pf-co-industry').value.trim(),
      companyContact: document.getElementById('pf-co-contact').value.trim(),
      companyEmail: document.getElementById('pf-co-email').value.trim(),
      companyPhone: document.getElementById('pf-co-phone').value.trim(),
      companyLocation: document.getElementById('pf-co-location').value.trim(),
      companyWebsite: document.getElementById('pf-co-website').value.trim()
    };
    DIMENSIONS.forEach(function(d){
      data[d.key] = document.getElementById('pf-'+d.key).value;
      data[d.key+'Owner'] = document.getElementById('pf-'+d.key+'Owner').value.trim();
      data[d.key+'Remarks'] = document.getElementById('pf-'+d.key+'Remarks').value.trim();
    });
    if(!data.name){ toast('Project name is required.'); return; }
    saveProject(data, p ? p.id : null);
  });
}
function confirmDeleteProject(id){
  var p = projectById(id);
  var count = state.worklogs.filter(function(w){return w.projectId===id;}).length;
  var html =
    '<div class="modal-head"><h3>Delete "'+esc(p?p.name:'')+'"?</h3></div>'+
    '<p class="sec">This removes the project from your list'+(count? '. Its '+count+' logged worklog '+(count===1?'entry stays':'entries stay')+' on record, just unlinked.' : '.')+' This can\'t be undone.</p>'+
    '<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="confirm-delete-project" data-id="'+id+'">'+iconTrash()+'Delete project</button></div>';
  openModal(html);
}
function openLogModal(id, presetProjectId){
  var w = id ? state.worklogs.filter(function(x){return x.id===id;})[0] : null;
  var v = w || {projectId: presetProjectId || (state.projects[0]&&state.projects[0].id) || '', date: todayStr(), category:'Technical', particulars:'', startTime:'', endTime:'', durationMinutes:''};
  var hasTimes = !!(v.startTime && v.endTime);
  var projOptions = state.projects.map(function(p){return '<option value="'+p.id+'"'+(v.projectId===p.id?' selected':'')+'>'+esc(p.name)+'</option>';}).join('');

  var html =
    '<div class="modal-head"><h3>'+(w?'Edit entry':'Log time')+'</h3></div>'+
    '<form id="log-form">'+
      '<div class="field-row">'+
        '<div class="field"><label>Project</label><select id="lf-project" required>'+projOptions+'</select></div>'+
        '<div class="field"><label>Date</label><input required type="date" id="lf-date" value="'+esc(v.date)+'"></div>'+
      '</div>'+
      '<div class="field"><label>Category</label><select id="lf-category">'+CATEGORIES.map(function(c){return '<option'+(v.category===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label>Particulars</label><input type="text" id="lf-particulars" value="'+esc(v.particulars||'')+'" placeholder="What did you work on?"></div>'+
      '<div class="field"><label>How to record time</label><div class="radio-row">'+
        '<label><input type="radio" name="timemode" value="times" '+(hasTimes||!w?'checked':'')+'> Start &amp; end time</label>'+
        '<label><input type="radio" name="timemode" value="hours" '+(!hasTimes&&w?'checked':'')+'> Total hours</label>'+
      '</div></div>'+
      '<div class="field-row" id="lf-times-wrap">'+
        '<div class="field"><label>Start</label><input type="time" id="lf-start" value="'+esc(v.startTime||'')+'"></div>'+
        '<div class="field"><label>End</label><input type="time" id="lf-end" value="'+esc(v.endTime||'')+'"></div>'+
      '</div>'+
      '<div class="field" id="lf-hours-wrap" hidden><label>Hours</label><input type="number" min="0" step="0.25" id="lf-hours" value="'+(v.durationMinutes?minsToHrs(v.durationMinutes):'')+'"></div>'+
      '<div class="modal-actions">'+
        (w? '<button type="button" class="btn btn-danger" data-action="delete-log" data-id="'+w.id+'">'+iconTrash()+'Delete</button>' : '')+
        '<div class="spacer"></div>'+
        '<button type="button" class="btn" data-action="close-modal">Cancel</button>'+
        '<button type="submit" class="btn btn-primary">'+(w?'Save changes':'Add entry')+'</button>'+
      '</div>'+
    '</form>';
  openModal(html);

  function syncMode(){
    var mode = document.querySelector('input[name=timemode]:checked').value;
    document.getElementById('lf-times-wrap').hidden = mode!=='times';
    document.getElementById('lf-hours-wrap').hidden = mode!=='hours';
  }
  document.querySelectorAll('input[name=timemode]').forEach(function(r){ r.addEventListener('change', syncMode); });
  syncMode();

  document.getElementById('log-form').addEventListener('submit', function(e){
    e.preventDefault();
    var mode = document.querySelector('input[name=timemode]:checked').value;
    var durationMinutes, startTime='', endTime='';
    if(mode==='times'){
      startTime = document.getElementById('lf-start').value;
      endTime = document.getElementById('lf-end').value;
      if(!startTime || !endTime){ toast('Enter both a start and end time, or switch to total hours.'); return; }
      var sm = toMinutes(startTime), em = toMinutes(endTime);
      durationMinutes = em>sm ? em-sm : (em+1440-sm);
      if(durationMinutes<=0){ toast('End time must be after start time.'); return; }
    } else {
      var hrs = parseFloat(document.getElementById('lf-hours').value);
      if(!hrs || hrs<=0){ toast('Enter the hours worked.'); return; }
      durationMinutes = Math.round(hrs*60);
    }
    var data = {
      projectId: document.getElementById('lf-project').value,
      date: document.getElementById('lf-date').value,
      category: document.getElementById('lf-category').value,
      particulars: document.getElementById('lf-particulars').value.trim(),
      startTime: startTime, endTime: endTime,
      durationMinutes: durationMinutes
    };
    if(!data.projectId){ toast('Choose a project.'); return; }
    saveWorklog(data, w ? w.id : null);
  });
}
function toMinutes(hm){ var p=hm.split(':'); return (+p[0])*60+(+p[1]); }
function confirmDeleteLog(id){
  var html = '<div class="modal-head"><h3>Delete this entry?</h3></div>'+
    '<p class="sec">This removes the logged time permanently.</p>'+
    '<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="confirm-delete-log" data-id="'+id+'">'+iconTrash()+'Delete</button></div>';
  openModal(html);
}
function openSettingsModal(){
  var sd = state.settings.staleDays||5;
  var html =
    '<div class="modal-head"><h3>Settings</h3></div>'+
    '<form id="settings-form">'+
      '<div class="field"><label>Follow-up window</label><input type="number" min="1" max="60" id="sf-staledays" value="'+sd+'">'+
        '<span class="hint">Flag a project when this many days pass with no client communication.</span></div>'+
      '<div class="modal-actions"><div class="spacer"></div><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>'+
    '</form>';
  openModal(html);
  document.getElementById('settings-form').addEventListener('submit', function(e){
    e.preventDefault();
    var v = clamp(parseInt(document.getElementById('sf-staledays').value,10)||5,1,60);
    saveSettings(v);
  });
}
function openWhatsAppModal(){
  var initialDate = latestWorklogDate();
  var html =
    '<div class="modal-head"><h3>WhatsApp log</h3></div>'+
    '<p class="sec" style="margin-bottom:14px;">Turns a day\'s particulars into a plain message you can paste straight into WhatsApp.</p>'+
    '<div class="field"><label>Date</label><input type="date" id="wa-date" value="'+esc(initialDate)+'"></div>'+
    '<div class="field"><label>Message</label><textarea id="wa-preview" rows="9" readonly style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; white-space:pre-wrap;">'+esc(buildWhatsAppText(initialDate))+'</textarea></div>'+
    '<div class="modal-actions">'+
      '<button type="button" class="btn" data-action="wa-download">'+iconDownload()+'Download .txt</button>'+
      '<div class="spacer"></div>'+
      '<button type="button" class="btn" data-action="close-modal">Close</button>'+
      '<button type="button" class="btn btn-primary" data-action="wa-copy">'+iconCopy()+'Copy to clipboard</button>'+
    '</div>';
  openModal(html);
  document.getElementById('wa-date').addEventListener('change', function(){
    document.getElementById('wa-preview').value = buildWhatsAppText(this.value);
  });
}
function copyWhatsAppText(){
  var ta = document.getElementById('wa-preview');
  var text = ta.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('Copied — paste it into WhatsApp.'); }, function(){ fallbackCopy(ta); });
  } else {
    fallbackCopy(ta);
  }
}
function fallbackCopy(ta){
  try{
    ta.removeAttribute('readonly'); ta.focus(); ta.select();
    var ok = document.execCommand('copy');
    ta.setAttribute('readonly','readonly');
    toast(ok ? 'Copied — paste it into WhatsApp.' : 'Could not copy automatically — select the text above and copy it manually.');
  }catch(e){ toast('Could not copy automatically — select the text above and copy it manually.'); }
}
async function downloadWhatsAppText(){
  var ta = document.getElementById('wa-preview');
  var dateStr = document.getElementById('wa-date').value;
  await doDownload('worklog-'+dateStr+'.txt', ta.value);
}

/* ===================== event delegation ===================== */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.getAttribute('data-action');
  var id = t.getAttribute('data-id');
  switch(action){
    case 'nav': setView(t.getAttribute('data-view')); break;
    case 'new-project': openProjectModal(null); break;
    case 'edit-project': openProjectModal(id); break;
    case 'delete-project': confirmDeleteProject(id); break;
    case 'confirm-delete-project': deleteProjectConfirmed(id); break;
    case 'touch-comm': touchLastComm(id); break;
    case 'fill-me':
      var meTarget = document.getElementById(t.getAttribute('data-target'));
      if(meTarget) meTarget.value = 'Raj';
      break;
    case 'new-log': openLogModal(null); break;
    case 'edit-log': openLogModal(id); break;
    case 'delete-log': confirmDeleteLog(id); break;
    case 'confirm-delete-log': deleteWorklogConfirmed(id); break;
    case 'start-timer':
      var pid = document.getElementById('timer-project').value;
      var cat = document.getElementById('timer-category').value;
      var part = document.getElementById('timer-particulars').value;
      beginTimer(pid, cat, part);
      break;
    case 'stop-timer': endTimer(); break;
    case 'open-settings': openSettingsModal(); break;
    case 'open-whatsapp': openWhatsAppModal(); break;
    case 'wa-copy': copyWhatsAppText(); break;
    case 'wa-download': downloadWhatsAppText(); break;
    case 'export-projects': exportProjectsCSV(); break;
    case 'export-worklog': exportWorklogCSV(); break;
    case 'close-modal': closeModal(); break;
    case 'reload-data': reloadData(); break;
    case 'open-login': openLoginModal(); break;
    case 'sign-out': signOut(); break;
    case 'auth-toggle-mode':
      state.authMode = (state.authMode==='signup') ? 'signin' : 'signup';
      renderLoginModalBody();
      break;
    case 'filter-status': state.statusFilter = t.getAttribute('data-status'); render(); break;
  }
});
document.addEventListener('input', function(e){
  if(e.target.matches('[data-action=search-projects]')){ state.search = e.target.value; renderProjectsOnly(); }
});
document.addEventListener('change', function(e){
  if(e.target.matches('[data-action=filter-log-project]')){ state.logFilterProject = e.target.value; render(); }
});
document.getElementById('modal-backdrop').addEventListener('click', function(e){
  if(e.target.id==='modal-backdrop') closeModal();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeModal();
});
function renderProjectsOnly(){
  // full re-render replaces the search input, so restore focus + caret position after
  if(state.view!=='projects') return;
  renderProjects();
  var input = document.querySelector('[data-action=search-projects]');
  if(input){ input.focus(); var len=input.value.length; input.setSelectionRange(len,len); }
}

/* ===================== master render ===================== */
function render(){
  renderNav();
  renderDashboard();
  renderProjects();
  renderWorklog();
  renderAnalytics();
  renderAuthWidget();
}

/* ===================== boot ===================== */
render();
loadTimer();
loadLocalData();
initAuth();

})();
</script>
